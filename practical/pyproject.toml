[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aam4j"
version = "0.2.0"
description = "Architecture-Aware Metrics for Java, practical track of the PhD"
requires-python = ">=3.10"

# Stages 1 to 3 depend on PyYAML and nothing else: the extractor parses
# application.yml and docker-compose.yml, and the DD-002 role catalogue is
# YAML. Everything heavier is confined to the optional groups below, so a
# reviewer reproducing the metric profiles installs one package.
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
learn = ["scikit-learn>=1.4", "numpy>=1.26"]
dev = ["pytest>=8", "httpx>=0.27"]

# The five packages each live under the directory of the pipeline stage that
# owns them, which is deliberate: `metrics/` is the stage, `aam4j_metrics/` is
# its importable package, and the stage directory also carries the stage's
# README and catalogue data.
#
# That layout has to be declared. Setuptools' automatic discovery sees docs/,
# data/, subjects/ and notebooks/ at the top level, cannot tell packages from
# working directories, and refuses to guess: "Multiple top-level packages
# discovered in a flat-layout". Listing them explicitly is the documented fix.
[tool.setuptools]
packages = [
    "aam4j_extractor",
    "aam4j_model",
    "aam4j_metrics",
    "aam4j_api",
    "aam4j_models",
]

[tool.setuptools.package-dir]
aam4j_extractor = "extractor/aam4j_extractor"
aam4j_model = "metamodel/aam4j_model"
aam4j_metrics = "metrics/aam4j_metrics"
aam4j_api = "api/aam4j_api"
aam4j_models = "models/aam4j_models"

[tool.pytest.ini_options]
# `subjects/` holds full clones of three Java projects, two of which ship their
# own Python test suites and conftest files. Without this, `pytest` from the
# repository root collects *their* tests and fails on *their* dependencies.
testpaths = ["tests"]
norecursedirs = ["subjects", "data", ".venv", ".git"]
pythonpath = ["extractor", "metamodel", "metrics", "api", "models"]
addopts = "-q"
